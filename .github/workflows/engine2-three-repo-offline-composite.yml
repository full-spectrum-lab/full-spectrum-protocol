name: Engine 2 three-repository offline composite validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/engine2-three-repo-offline-composite.yml"

env:
  ENGINE_COMMIT: 11c6f83593a327457940c6b5832aa03aa50713ee
  ENGINE_EVIDENCE_COMMIT: 0df9018a0a49b701a4076e82f28134ad6b8b4a21
  OBSERVER_COMMIT: 98da9559b8076770d9b5471ba0fde2cac4a6fe3c
  OBSERVER_IMPLEMENTATION_COMMIT: 10b7f76f4bde0dd4dc88731dcd57c98936a72c1e
  KG_COMMIT: 869f61bd7bb970a2743058a52fe1e23570667028

jobs:
  offline-composite:
    runs-on: windows-latest
    steps:
      - name: Checkout Protocol
        uses: actions/checkout@v4
        with:
          path: full-spectrum-protocol
          fetch-depth: 0
      - name: Preserve canonical LF checkout bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Checkout pinned Observer
        uses: actions/checkout@v4
        with:
          repository: full-spectrum-lab/full-spectrum-observer
          ref: ${{ env.OBSERVER_COMMIT }}
          path: full-spectrum-observer
      - name: Checkout pinned Engine
        uses: actions/checkout@v4
        with:
          repository: full-spectrum-lab/full-spectrum-engine
          ref: ${{ env.ENGINE_COMMIT }}
          path: full-spectrum-engine
      - name: Checkout pinned Knowledge Governance
        uses: actions/checkout@v4
        with:
          repository: full-spectrum-lab/full-spectrum-knowledge-governance
          ref: ${{ env.KG_COMMIT }}
          path: full-spectrum-knowledge-governance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.301"
      - name: Install Protocol fixture dependencies
        run: python -m pip install PyYAML==6.0.2 rfc8785==0.1.4
      - name: Verify pinned commits
        shell: pwsh
        run: |
          if ((git -C full-spectrum-observer rev-parse HEAD) -ne $env:OBSERVER_COMMIT) { throw 'Observer commit mismatch' }
          if ((git -C full-spectrum-engine rev-parse HEAD) -ne $env:ENGINE_COMMIT) { throw 'Engine commit mismatch' }
          if ((git -C full-spectrum-knowledge-governance rev-parse HEAD) -ne $env:KG_COMMIT) { throw 'KG commit mismatch' }
      - name: Verify Protocol fixture
        run: python full-spectrum-protocol/tools/verify_engine2_fixture.py full-spectrum-protocol/fixtures/engine2/engine2-cross-repo-fixture-0.3.0-rc.yaml
      - name: Run Observer adapter and pinned Engine tests
        shell: pwsh
        working-directory: full-spectrum-observer
        env:
          FSP_ENGINE2_PINNED_CHECKOUT: ${{ github.workspace }}\full-spectrum-engine
        run: |
          python -m pip install pytest==9.0.2 numpy==1.26.4 jsonschema==4.25.1 typing_extensions==4.15.0
          python -m pytest -q tests/engine2 tests/compat
      - name: Run Engine 2 offline tests
        working-directory: full-spectrum-engine
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q tests/test_engine2_offline.py tests/test_engine2_persistence_fixture.py tests/test_engine2_boundary_adapters.py
      - name: Run KG Engine 2 adapter tests
        working-directory: full-spectrum-knowledge-governance
        shell: pwsh
        run: |
          dotnet restore FullSpectrum.Knowledge.slnx --locked-mode
          dotnet build FullSpectrum.Knowledge.slnx -c Release --no-restore
          dotnet run --project tests/FullSpectrum.Knowledge.Tests -c Release --no-build
      - name: Run Observer to Engine to KG offline runtime chain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force composite-evidence | Out-Null
          python full-spectrum-protocol/tools/engine2_composite/run_observer_engine_projection.py `
            --observer full-spectrum-observer `
            --engine full-spectrum-engine `
            --output composite-evidence/kg-envelope.json
          dotnet run `
            --project full-spectrum-protocol/tools/engine2_composite/KgReplayHarness/KgReplayHarness.csproj `
            -p:KnowledgeGovernanceRoot=${{ github.workspace }}/full-spectrum-knowledge-governance `
            -- composite-evidence/kg-envelope.json composite-evidence/kg-audit.sqlite3 composite-evidence/runtime-result.json
          Get-ChildItem composite-evidence -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name
          } | Set-Content composite-evidence/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Upload offline runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: engine2-three-repo-offline-runtime-${{ github.run_id }}
          path: composite-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Composite boundary result
        run: |
          echo "OFFLINE_COMPONENTS_VALIDATED=PASS"
          echo "OBSERVER_ENGINE_KG_RUNTIME_CHAIN=PASS"
          echo "FORMAL_COMPATIBILITY=NOT_CONFIRMED"
          echo "CROSS_REPO_E2E=NOT_CONFIRMED"
          echo "PRODUCTION_READY=NO"
