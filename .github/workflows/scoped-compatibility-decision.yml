name: Scoped compatibility decision check

on:
  push:
    paths:
      - "schemas/scoped-compatibility-decision.schema.json"
      - "status/engine2-pinned-offline-compatibility-*.json"
      - "COMPATIBILITY_MATRIX.json"
      - ".github/workflows/scoped-compatibility-decision.yml"
  pull_request:
    paths:
      - "schemas/scoped-compatibility-decision.schema.json"
      - "status/engine2-pinned-offline-compatibility-*.json"
      - "COMPATIBILITY_MATRIX.json"
      - ".github/workflows/scoped-compatibility-decision.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema==4.25.1
      - name: Validate scoped decision and conservative boundaries
        shell: python
        run: |
          import json
          import pathlib
          import jsonschema

          schema = json.loads(pathlib.Path("schemas/scoped-compatibility-decision.schema.json").read_text(encoding="utf-8"))
          decision = json.loads(pathlib.Path("status/engine2-pinned-offline-compatibility-20260910.json").read_text(encoding="utf-8"))
          matrix = json.loads(pathlib.Path("COMPATIBILITY_MATRIX.json").read_text(encoding="utf-8"))
          jsonschema.Draft202012Validator(schema, format_checker=jsonschema.FormatChecker()).validate(decision)
          assert all(value == "NOT_CONFIRMED" for value in matrix["triangle_status"].values())
          assert decision["global_boundaries"] == {
              "general_compatibility": "NOT_CONFIRMED",
              "cross_repo_e2e": "NOT_CONFIRMED",
              "real_network_authorization": "NOT_AUTHORIZED",
              "production_ready": "NO",
              "automatic_promotion": "FORBIDDEN",
          }
          print("SCOPED_COMPATIBILITY_DECISION=PASS")
          print("GENERAL_COMPATIBILITY_PROMOTION=NONE")
