name: FDE-TRIAL-001 runtime contract check

on:
  push:
    paths:
      - "schemas/fde-trial-001-runtime-message.schema.json"
      - "examples/fde-trial-001-runtime/**"
      - "tools/verify_fde_trial_runtime_contract.py"
      - ".github/workflows/fde-trial-001-runtime-contract-check.yml"
  pull_request:
    paths:
      - "schemas/fde-trial-001-runtime-message.schema.json"
      - "examples/fde-trial-001-runtime/**"
      - "tools/verify_fde_trial_runtime_contract.py"
      - ".github/workflows/fde-trial-001-runtime-contract-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema==4.25.1
      - run: python tools/verify_fde_trial_runtime_contract.py
