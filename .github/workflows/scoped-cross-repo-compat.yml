name: Scoped cross-repository compatibility

on:
  push:
    branches: [main]
    paths:
      - "COMPATIBILITY_MATRIX.json"
      - "schemas/full-spectrum-status.schema.json"
      - "tools/validate_full_spectrum_status.py"
      - ".github/workflows/scoped-cross-repo-compat.yml"
  pull_request:
    branches: [main]
    paths:
      - "COMPATIBILITY_MATRIX.json"
      - "schemas/full-spectrum-status.schema.json"
      - "tools/validate_full_spectrum_status.py"
      - ".github/workflows/scoped-cross-repo-compat.yml"
  workflow_dispatch:

env:
  ENGINE_REF: v1.5.0
  ENGINE_COMMIT: ab9939b2aaf2a921b6ae6e7a6af5d34cd07af424
  OBSERVER_REF: 1946f8a0b1ffc67adf4f0095994adab030cdde2e
  OBSERVER_EVIDENCE_SHA256: 00d26d2b488aacc29c114b7dd29400a8e160f416d31cb68068324d526755a5a4

jobs:
  scoped-composite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Protocol
        uses: actions/checkout@v4
        with:
          path: protocol

      - name: Checkout pinned Engine v1.5.0
        uses: actions/checkout@v4
        with:
          repository: full-spectrum-lab/full-spectrum-engine
          ref: ${{ env.ENGINE_REF }}
          path: engine

      - name: Checkout pinned Observer compatibility evidence
        uses: actions/checkout@v4
        with:
          repository: full-spectrum-lab/full-spectrum-observer
          ref: ${{ env.OBSERVER_REF }}
          path: observer

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify pinned revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = "$ENGINE_COMMIT"
          test "$(git -C observer rev-parse HEAD)" = "$OBSERVER_REF"

      - name: Install scoped test dependencies
        run: python -m pip install pytest PyYAML jsonschema fastapi httpx numpy

      - name: Validate Observer status against Protocol schema
        run: python protocol/tools/validate_full_spectrum_status.py observer/status/full-spectrum-status.yaml

      - name: Verify Observer evidence bundle integrity
        shell: bash
        run: |
          set -euo pipefail
          actual=$(sha256sum observer/observer-ig5-evidence-20260905.zip | awk '{print $1}')
          test "$actual" = "$OBSERVER_EVIDENCE_SHA256"

      - name: Run Engine v1.5 compatibility API tests
        working-directory: engine
        run: python -m pytest -q tests/test_compat.py

      - name: Run Observer v1.5 adapter and fixture tests
        working-directory: observer
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/compat/test_v15_adapter.py tests/compat/test_compatibility_matrix.py

      - name: Enforce scoped compatibility boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path("observer/engine/worker.lock.json").read_text(encoding="utf-8-sig"))
          if lock["engine_version"] != "v1.0.0":
              raise SystemExit("Observer worker lock changed; review the formal compatibility scope.")
          print("SCOPED_COMPOSITE_PASS: Engine v1.5 tests and Observer adapter fixtures passed.")
          print("FORMAL_E2E_NOT_CONFIRMED: Observer release worker remains locked to Engine v1.0.0.")
          PY
